# Fixed docker-compose.yml for CVE-2018-1000656 (Flask / Werkzeug debugger)
#
# This is the REMEDIATED version used in Work 1, step 9 ("Developing and
# Applying Protection Measures").
#
# The original vulhub file exposes a Flask version vulnerable to
# CVE-2018-1000656 because it runs with the debugger enabled and a
# predictable/weak PIN. The fix here:
#   1. upgrades Flask to a patched release, and
#   2. disables the debug mode so the Werkzeug debugger is not exposed.
#
# NOTE: compare with the original file in vulhub/flask/CVE-2018-1000656/ and
# keep the same service name / ports as the vulhub README expects.

version: "2"
services:
  web:
    # Vulnerable image was an old Flask release; upgrade to a patched one.
    # (Adjust the exact tag to a version where CVE-2018-1000656 is fixed.)
    image: vulhub/flask:1.0.3
    ports:
      - "8080:8080"
    environment:
      # Disable the debugger so the Werkzeug debug endpoint is not exposed.
      FLASK_ENV: production
      FLASK_DEBUG: "0"
